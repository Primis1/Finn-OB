version: '3.8'

services:
  app:
    build: .
    container_name: finn-ob
    ports:
      - "3000"  # Internal only
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PAYLOAD_SECRET=${PAYLOAD_SECRET}
      - NEXT_PUBLIC_SERVER_URL=https://finn-ob.ca  # Update to HTTPS
    volumes:
      - payload_media:/app/media
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/letsencrypt:/etc/letsencrypt
      - ./nginx/html:/var/www/html
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - app-network

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./nginx/letsencrypt:/etc/letsencrypt
      - ./nginx/html:/var/www/html
    command: certonly --webroot --webroot-path=/var/www/html --email olafbaben@gmail.com --agree-tos --no-eff-email -d finn-ob.ca -d www.finn-ob.ca
    depends_on:
      - nginx
    networks:
      - app-network

volumes:
  payload_media:

networks:
  app-network:
    driver: bridge
