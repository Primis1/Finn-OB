# HTTP → HTTPS redirect
server {
    listen 80;
    server_name finn-ob.ca www.finn-ob.ca;
    return 301 https://$host$request_uri;
}

# HTTPS main config
server {
    listen 443 ssl;
    server_name finn-ob.ca www.finn-ob.ca;

    ssl_certificate /etc/letsencrypt/live/finn-ob.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finn-ob.ca/privkey.pem;

    location / {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
    }

    # Let's Encrypt renewal
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
}
