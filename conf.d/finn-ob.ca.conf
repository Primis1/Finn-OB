# HTTP server - for initial certbot verification and redirect
server {
    listen 80;
    server_name finn-ob.ca www.finn-ob.ca;

    # Certbot challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server - your existing configuration plus SSL
server {
    listen 443 ssl;
    server_name finn-ob.ca www.finn-ob.ca;

    # SSL certificates (will be added by certbot)
    ssl_certificate /etc/letsencrypt/live/finn-ob.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finn-ob.ca/privkey.pem;

    # Your existing configuration goes here
    # For example:
    location / {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Add security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
}
